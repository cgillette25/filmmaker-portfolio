backend:
  name: github
  repo: cgillette25/filmmaker-portfolio
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "videos"
    label: "Videos"
    label_singular: "Video"
    folder: "src/content/videos"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}  /  {{category}}"
    sortable_fields: ["date", "title", "category"]
    view_groups:
      - label: "Type"
        field: category
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The name of the film, as you want it shown on the site."

      - label: "Type"
        name: "category"
        widget: "select"
        options:
          - { label: "Short Film", value: "shorts" }
          - { label: "Dance Film", value: "dance" }
          - { label: "Vertical", value: "verticals" }
          - { label: "Mini-Series episode", value: "series" }

      - label: "YouTube link or video ID"
        name: "youtubeId"
        widget: "string"
        pattern: ['^\s*(?:[A-Za-z0-9_-]{11}|https?://\S+)\s*$', "Paste the whole YouTube link, or just the 11-character ID."]
        hint: >-
          Easiest way: open the video, hit Share, and paste the whole link.
          Any YouTube format works and the tracking bit on the end is ignored.
          youtu.be/RTkpus2edYY?si=abc123  and  youtube.com/watch?v=RTkpus2edYY
          and  youtube.com/shorts/2okP98wrZ7o  all point at the same video.

      - label: "Series"
        name: "series"
        widget: "relation"
        required: false
        collection: "series"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "{{slug}}"
        hint: "Only for Mini-Series episodes. Leave blank otherwise."

      - label: "Episode number"
        name: "episode"
        widget: "number"
        required: false
        value_type: "int"
        min: 1
        hint: "Only for Mini-Series episodes. Episodes play in this order."

      - label: "Date"
        name: "date"
        widget: "datetime"
        required: false
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false
        hint: "Optional. Newest shows first when no running order is set."

      - label: "Running order"
        name: "order"
        widget: "number"
        required: false
        value_type: "int"
        min: 1
        hint: "Optional. 1 puts it first on its page. Beats the date."

      - label: "Show on the home page"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Featured videos are pulled to the top of Selected Work."

      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: >-
          This is the summary people read on the card before they decide to watch.
          Write as much or as little as you like. Leave it blank and the card just
          shows the title.

  - name: "series"
    label: "Mini-Series"
    label_singular: "Series"
    folder: "src/content/series"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - label: "Series title"
        name: "title"
        widget: "string"
        hint: "Shown above its episodes on the Mini-Series page."

      - label: "Description"
        name: "blurb"
        widget: "text"
        required: false
        hint: "One or two lines about the show, shown under the title."

      - label: "Running order"
        name: "order"
        widget: "number"
        required: false
        value_type: "int"
        min: 1
        hint: "Optional. Only matters once there is more than one series."
